<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그래머콕</title>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@500&display=swap');

  :root{
    --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#F1EBDD;
    --ink:#1F2A2E; --ink-soft:#5C6B70;
    --accent:#1F6F5E; --accent-soft:#E1EFE9;
    --blank:#2B5FA5; --blank-soft:#E7EEF8;
    --good:#2F8F5B; --good-bg:#E7F5ED;
    --bad:#C0392B; --bad-bg:#FBEAE8;
    --hint:#8A6210; --hint-bg:#FBF1DC;
    --line:#E4DFCF; --hl:#FFE27A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14191B; --surface:#1C2326; --surface-2:#222B2C;
      --ink:#EDEEE7; --ink-soft:#A8B3B0;
      --accent:#5FC1A2; --accent-soft:#1E3730;
      --blank:#7FADEB; --blank-soft:#1D2C3E;
      --good:#63CD93; --good-bg:#163523;
      --bad:#E4796C; --bad-bg:#3A211D;
      --hint:#E0B75B; --hint-bg:#33290F;
      --line:#2E3739; --hl:#7A6320;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14191B; --surface:#1C2326; --surface-2:#222B2C;
    --ink:#EDEEE7; --ink-soft:#A8B3B0;
    --accent:#5FC1A2; --accent-soft:#1E3730;
    --blank:#7FADEB; --blank-soft:#1D2C3E;
    --good:#63CD93; --good-bg:#163523;
    --bad:#E4796C; --bad-bg:#3A211D;
    --hint:#E0B75B; --hint-bg:#33290F;
    --line:#2E3739; --hl:#7A6320;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    padding-inline:16px; padding-block:20px;
    display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:900px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:18px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .name{ font-family:'Jua','Noto Serif KR',serif; font-weight:400; font-size:22px; letter-spacing:.01em; }
  .brand .tag{ font-size:12px; color:var(--ink-soft); }
  .hud{ display:flex; align-items:center; gap:10px; }
  .mascot{ width:40px; height:40px; flex:none; }
  .mascot svg{ width:100%; height:100%; display:block; }
  .mascot.bounce{ animation:mascotBounce .5s ease; }
  .mascot.wobble{ animation:mascotWobble .5s ease; }
  @keyframes mascotBounce{ 0%{transform:scale(1) rotate(0);} 30%{transform:scale(1.25) rotate(-8deg);} 60%{transform:scale(.94) rotate(5deg);} 100%{transform:scale(1) rotate(0);} }
  @keyframes mascotWobble{ 0%{transform:translateX(0);} 20%{transform:translateX(-6px) rotate(-5deg);} 40%{transform:translateX(6px) rotate(5deg);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} 100%{transform:translateX(0);} }
  .score{
    font-family:'Jua',sans-serif; font-size:14px; color:var(--hint); background:var(--hint-bg);
    padding:6px 14px; border-radius:999px; border:1.5px solid var(--hint); white-space:nowrap;
  }
  .progress{
    font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums;
    font-size:13px; color:var(--accent); background:var(--accent-soft);
    padding:5px 12px; border-radius:999px; white-space:nowrap;
  }

  .nav{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .nav button{
    font-family:'Jua',sans-serif; font-size:13px; font-weight:400;
    padding:8px 14px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; gap:6px;
    box-shadow:0 2.5px 0 rgba(0,0,0,.08);
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s, color .15s;
  }
  .nav button:active{ transform:translateY(2px); box-shadow:0 .5px 0 rgba(0,0,0,.08); }
  .nav button.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .nav button .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); flex:none; }
  .nav button.done .dot{ background:var(--good); }

  .finder{ margin-bottom:18px; }
  .finder-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
    font-family:'Jua',sans-serif; font-size:15px; padding:11px 16px; border-radius:14px;
    border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent); cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.08);
  }
  .finder-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.08); }
  .finder-btn .cur{ color:var(--ink); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .finder-panel{ margin-top:8px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); padding:12px; box-shadow:0 6px 22px rgba(0,0,0,.08); }
  .finder-input{
    width:100%; font:inherit; font-size:15px; padding:10px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink); margin-bottom:8px;
  }
  .finder-list{ max-height:55vh; overflow-y:auto; }
  .f-chap{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:12px 0 4px; padding-top:8px; border-top:1px dashed var(--line); }
  .f-chap:first-child{ margin-top:0; border-top:none; padding-top:0; }
  .f-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit; font-size:14px;
    padding:8px 10px; border:none; border-radius:8px; background:none; color:var(--ink); cursor:pointer;
  }
  .f-row:hover{ background:var(--accent-soft); }
  .f-row.cur{ background:var(--accent-soft); font-weight:700; }
  .f-row .n{ font-family:'DM Mono',monospace; font-size:12px; color:var(--accent); min-width:3.4em; }
  .f-row .t{ flex:1; }
  .f-row .tagdone{ color:var(--good); font-size:12px; font-weight:700; }
  .f-row.soon{ color:var(--ink-soft); cursor:default; opacity:.6; }
  .f-row.soon:hover{ background:none; }
  .f-row .tagsoon{ font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .f-empty{ font-size:13px; color:var(--ink-soft); padding:10px 4px; }
  .cname{ font-family:'Jua','Noto Serif KR',serif; font-size:clamp(18px,3.6vw,24px); color:var(--accent); margin:0 0 6px; }
  .card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:22px;
    padding:24px; margin-bottom:20px; box-shadow:0 6px 22px rgba(0,0,0,.05);
  }
  .eyebrow{
    font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.06em;
    color:var(--accent); text-transform:uppercase; margin-bottom:8px;
  }
  h1{
    font-family:'Jua','Noto Serif KR',serif; font-weight:400;
    font-size:clamp(20px,4vw,28px); line-height:1.4; margin:0 0 20px;
    text-wrap:balance;
  }
  h2{
    font-size:14px; font-weight:900; color:var(--accent);
    margin:0 0 10px; display:flex; align-items:center; gap:6px;
  }
  .section{ margin-bottom:20px; }
  .explain p{ font-size:16px; line-height:2.1; margin:0 0 10px; color:var(--ink); }
  .hl{ font-weight:700; background:linear-gradient(transparent 55%, var(--hl) 55%); border-radius:2px; }
  .verb{ text-decoration:underline; text-decoration-color:var(--ink-soft); text-underline-offset:3px; }

  /* reveal-type blank */
  .blank{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:2.6em; padding:0 8px; margin:1px 2px;
    border-radius:6px; border:1.5px dashed var(--blank);
    background:var(--blank-soft); color:var(--blank);
    font-weight:700; cursor:pointer; font-size:0.95em;
    transition:background .15s, border-style .15s;
  }
  .blank:hover{ background:var(--blank); color:var(--surface); }
  .blank.revealed{
    border-style:solid; background:var(--good-bg); border-color:var(--good);
    color:var(--good); cursor:default;
  }
  .blank.revealed:hover{ background:var(--good-bg); color:var(--good); }

  /* choice-type inline blank group */
  .cgroup{
    display:inline-flex; gap:4px; margin:2px 3px; vertical-align:middle;
  }
  .cbtn{
    font-family:'Jua',sans-serif; font-size:0.9em; font-weight:400;
    padding:3px 12px; border-radius:999px; border:1.5px solid var(--blank);
    background:var(--blank-soft); color:var(--blank); cursor:pointer;
    box-shadow:0 2.5px 0 rgba(0,0,0,.08);
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s, color .15s;
  }
  .cbtn:active{ transform:translateY(2px); box-shadow:0 .5px 0 rgba(0,0,0,.08); }
  .cbtn.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .cbtn.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); opacity:.6; }
  .cbtn[disabled]{ cursor:default; }

  .example{ border-top:1px dashed var(--line); padding:13px 0; }
  .example:first-child{ border-top:none; padding-top:4px; }
  .example .enrow{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .example .en{ font-size:16px; flex:1; }
  .example .kr{ font-size:13px; color:var(--ink-soft); }
  .example .kr .slash{ color:var(--line); margin:0 3px; }

  .speak{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .speak:hover{ border-color:var(--accent); color:var(--accent); }
  .speak svg{ width:13px; height:13px; }

  .tip{
    background:var(--hint-bg); border:1px solid var(--hint);
    border-radius:10px; padding:14px 16px; font-size:14px; color:var(--ink);
  }
  .tip .tip-label{ color:var(--hint); display:block; font-size:12px; font-weight:700; margin-bottom:5px; }
  .tip b{ font-weight:700; }
  .tip .bad-mark{ color:var(--bad); font-weight:700; }

  .quiz{ background:var(--accent-soft); border-radius:14px; padding:18px; }
  .q{ margin-bottom:16px; }
  .q:last-child{ margin-bottom:0; }
  .q .prompt{ font-size:15px; font-weight:500; margin-bottom:10px; }
  .q .prompt u{ text-decoration-thickness:2px; text-underline-offset:3px; }
  .q .prompt .tag{
    font-family:'DM Mono',monospace; font-size:10px; font-weight:700;
    color:var(--accent); border:1px solid var(--accent); border-radius:5px;
    padding:1px 6px; margin-right:6px; vertical-align:middle;
  }
  .choices{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .choice{
    font-family:'Jua',sans-serif; font-size:15px; font-weight:400;
    padding:9px 18px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.08);
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s, color .15s;
  }
  .choice:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.08); }
  .choice.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .choice.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); opacity:.55; }
  .choice[disabled]{ cursor:default; }
  .feedback{ font-size:13px; color:var(--ink-soft); min-height:1.4em; }
  .feedback .hint-label{ color:var(--hint); font-weight:700; }
  .feedback .retry-label{ color:var(--bad); font-weight:700; }
  .feedback .answer-label{ color:var(--good); font-weight:700; }

  .summary{
    border:1.5px solid var(--good); background:var(--good-bg); border-radius:14px; padding:18px;
  }
  .summary h2{ color:var(--good); }
  .summary .explain p{ color:var(--ink); }
  .summary .kw{ font-weight:700; color:var(--good); }
  .summary .example{ border-top-color:rgba(0,0,0,.08); }
  .locked{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border:1.5px dashed var(--line); border-radius:14px; color:var(--ink-soft); font-size:13px;
  }
  .locked svg{ width:16px; height:16px; flex:none; }

  .cardfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:10px; flex-wrap:wrap; }
  .reset{ font-size:12px; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .pager{ display:flex; gap:8px; }
  .pager button{
    font-family:'Jua',sans-serif; font-size:14px; font-weight:400; padding:9px 18px;
    border-radius:14px; border:1.5px solid var(--accent); background:var(--accent); color:var(--surface); cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
    transition:transform .08s, box-shadow .08s;
  }
  .pager button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .pager button.ghost{ background:none; color:var(--accent); box-shadow:none; }
  .pager button.ghost:active{ box-shadow:none; }
  .pager button:disabled{ opacity:.35; cursor:default; }

  footer{ text-align:center; font-size:12px; color:var(--ink-soft); padding:10px 0 4px; }

  /* score balloon-pop feedback */
  .pop-wrap{ position:fixed; z-index:9999; pointer-events:none; left:0; top:0; }
  .pop-balloon{ position:absolute; width:32px; height:40px; margin-left:-16px; margin-top:-20px; animation:balloonRise .9s ease-out forwards; }
  .pop-balloon svg{ width:100%; height:100%; display:block; }
  .pop-score{
    position:absolute; font-family:'Jua',sans-serif; font-size:18px; margin-left:-30px; margin-top:-14px;
    width:60px; text-align:center; animation:scoreFloat 1s ease-out forwards; white-space:nowrap;
  }
  .pop-score.good{ color:var(--good); }
  .pop-score.bad{ color:var(--bad); }
  @keyframes balloonRise{
    0%{ transform:scale(.4); opacity:0; }
    15%{ transform:scale(1); opacity:1; }
    60%{ transform:translateY(-46px) scale(1.05); opacity:1; }
    72%{ transform:translateY(-56px) scale(1.4); opacity:1; }
    80%{ transform:translateY(-58px) scale(.1); opacity:0; }
    100%{ transform:translateY(-58px) scale(.1); opacity:0; }
  }
  @keyframes scoreFloat{
    0%{ transform:translateY(0); opacity:0; }
    20%{ opacity:1; }
    100%{ transform:translateY(-70px); opacity:0; }
  }

  .c1line{ margin-top:8px; font-size:13px; color:var(--hint); background:var(--hint-bg); border-radius:8px; padding:7px 10px; }
  .c1line b{ font-weight:700; }
  .summary .c1sum{ font-size:15px; font-weight:700; color:var(--good); margin:0 0 12px; line-height:1.7; }
  details.more{ margin-top:14px; border:1.5px dashed var(--line); border-radius:12px; background:var(--surface); }
  details.more > summary{ cursor:pointer; padding:10px 14px; font-family:'Jua',sans-serif; font-size:14px; color:var(--accent); list-style:none; }
  details.more > summary::-webkit-details-marker{ display:none; }
  details.more > summary::before{ content:'＋ '; }
  details.more[open] > summary::before{ content:'－ '; }
  .more-block{ padding:4px 14px 14px; border-top:1px dashed var(--line); }
  .more-title{ font-weight:700; font-size:14px; margin:10px 0 4px; color:var(--ink); }
  .more-body{ font-size:14px; line-height:1.8; color:var(--ink); margin-bottom:6px; }
  .more-ex{ padding:3px 0; }
  .more-ex .en{ font-size:15px; font-weight:500; }
  .more-ex .kr{ font-size:12.5px; color:var(--ink-soft); }
  .more-ex .bad-mark{ color:var(--bad); font-weight:700; }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="name">그래머콕</span>
      <span class="tag">중학영문법 개념 Q&amp;A</span>
    </div>
    <div class="hud">
      <div class="mascot" id="mascot"></div>
      <div class="score" id="scoreBadge">⭐ 0</div>
      <div class="progress" id="progress">0 / 0 완료</div>
    </div>
  </div>

  <div class="finder">
    <button class="finder-btn" id="finderBtn" type="button"></button>
    <div class="finder-panel" id="finderPanel" hidden>
      <input id="finderInput" class="finder-input" type="search" placeholder="개념 이름으로 찾기 (예: 관계대명사, be동사)" autocomplete="off">
      <div id="finderList" class="finder-list"></div>
    </div>
  </div>
  <div id="cardHost"></div>
  <footer>빈칸과 문제는 정답을 맞힐 때까지 다시 시도할 수 있다. 문제를 다 맞히면 개념 정리가 열린다.</footer>

<script>

let bestVoice = null;
function pickBestVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;
    const prefs = [
      v => /^en-US$/i.test(v.lang) && /natural|online|neural/i.test(v.name),
      v => /^en-GB$/i.test(v.lang) && /natural|online|neural/i.test(v.name),
      v => /^en-US$/i.test(v.lang) && /google/i.test(v.name),
      v => /^en-US$/i.test(v.lang),
      v => /^en/i.test(v.lang) && /natural|online|neural/i.test(v.name),
      v => /^en/i.test(v.lang),
    ];
    for (const pred of prefs){ const found = voices.find(pred); if (found) return found; }
    return voices[0];
  }catch(e){ return null; }
}
if (AUDIO_ENABLED && 'speechSynthesis' in window){
  bestVoice = pickBestVoice();
  window.speechSynthesis.onvoiceschanged = () => { bestVoice = pickBestVoice(); };
}

function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92;
    if (bestVoice) u.voice = bestVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakQueue(texts){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    texts.forEach(t => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-US'; u.rate = 0.92;
      if (bestVoice) u.voice = bestVoice;
      window.speechSynthesis.speak(u);
    });
  }catch(e){}
}

  void el.offsetWidth;
  el.classList.add(mood === 'happy' ? 'bounce' : 'wobble');
  clearTimeout(bounceMascot._t);
  bounceMascot._t = setTimeout(() => setMascot('neutral'), 900);
}
function popFeedback(x, y, delta){
  const wrap = document.createElement('div');
  wrap.className = 'pop-wrap';
  wrap.style.left = x + 'px';
  wrap.style.top = y + 'px';
  const balloon = document.createElement('div');
  balloon.className = 'pop-balloon';
  balloon.innerHTML = delta > 0 ? BALLOON_GOOD : BALLOON_BAD;
  const scoreEl = document.createElement('div');
  scoreEl.className = 'pop-score ' + (delta > 0 ? 'good' : 'bad');
  scoreEl.textContent = (delta > 0 ? '+' : '') + delta;
  wrap.appendChild(balloon);
  wrap.appendChild(scoreEl);
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1100);
}
function addScore(delta, ev){
  score = Math.max(0, score + delta);
  const badge = document.getElementById('scoreBadge');
  if (badge) badge.textContent = '⭐ ' + score;
  if (ev) popFeedback(ev.clientX, ev.clientY, delta);
  bounceMascot(delta > 0 ? 'happy' : 'sad');
}

function plainText(segs){ return segs.map(s => s.v).join(''); }

function blankKey(prefix){ let n = 0; return () => prefix + '-' + (n++); }

const state = DATA.map(c => ({
  revealed: new Set(),          // reveal-blank keys shown
  choiceDone: new Set(),        // choice-blank keys answered correctly
  choiceWrong: {},              // choice-blank key -> Set of wrong picks
  quizDone: {},                 // qi -> true
  quizWrong: {},                // qi -> Set of wrong picks
  exSpoken: new Set(),          // example indices already auto-spoken
}));

let current = 0;

function exampleBlankKeys(c, xi){
  const keys = [];
  let n = 0;
  c.examples[xi].en.forEach(seg => { if (seg.t === 'blank') keys.push('xa' + xi + '-' + (n++)); });
  return keys;
}

function isBlankSegDone(s, key, seg){
  return seg.choices ? s.choiceDone.has(key) : s.revealed.has(key);
}

function isExampleDone(c, s, xi){
  const keys = exampleBlankKeys(c, xi);
  if (keys.length === 0) return true;
  return keys.every(k => s.revealed.has(k) || s.choiceDone.has(k));
}

function isConceptDone(i){
  const c = DATA[i], s = state[i];
  if (!c.check.length) return false;
  return c.check.every((q, qi) => s.quizDone[qi]);
}

let finderOpen = false, finderQuery = '';
function renderNav(){
  const c = DATA[current];
  const done = DATA.filter((_, i) => isConceptDone(i)).length;
  document.getElementById('progress').textContent = done + ' / ' + DATA.length + ' 완료';
  const btn = document.getElementById('finderBtn');
  btn.innerHTML = '<span>개념 찾기</span><span class="cur">' + escapeHtml(c.num + ' · ' + c.name) + (finderOpen ? '  ▲' : '  ▼') + '</span>';
  document.getElementById('finderPanel').hidden = !finderOpen;
  if (finderOpen) renderFinderList();
}
function renderFinderList(){
  const q = finderQuery.trim().toLowerCase();
  const list = document.getElementById('finderList');
  let html = '', lastCh = null, shown = 0;
  ALL.forEach(item => {
    const di = item.built ? DATA.findIndex(c => c.num === item.num) : -1;
    const name = item.built ? DATA[di].name : item.name;
    const hay = (item.num + ' ' + name + ' ' + (item.built ? DATA[di].kw : '') + ' ' + CHAP[item.ch]).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    if (item.ch !== lastCh){ html += '<div class="f-chap">Chapter ' + item.ch + ' · ' + escapeHtml(CHAP[item.ch]) + '</div>'; lastCh = item.ch; }
    shown++;
    if (item.built){
      const dn = isConceptDone(di);
      html += '<button class="f-row' + (di === current ? ' cur' : '') + '" data-go="' + di + '"><span class="n">' + escapeHtml(item.num) + '</span><span class="t">' + escapeHtml(name) + '</span>' + (dn ? '<span class="tagdone">완료</span>' : '') + '</button>';
    } else {
      html += '<div class="f-row soon"><span class="n">' + item.num + '</span><span class="t">' + escapeHtml(name) + '</span><span class="tagsoon">준비 중</span></div>';
    }
  });
  list.innerHTML = shown ? html : '<div class="f-empty">찾는 개념이 없어요. 다른 낱말로 검색해 보세요.</div>';
  list.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    current = parseInt(el.dataset.go, 10); finderOpen = false; finderQuery = ''; render(); window.scrollTo({top:0, behavior:'smooth'});
  });
}
document.getElementById('finderBtn').onclick = () => { finderOpen = !finderOpen; renderNav(); if (finderOpen) document.getElementById('finderInput').focus(); };
document.getElementById('finderInput').oninput = (e) => { finderQuery = e.target.value; renderFinderList(); };

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

// tip text: bold English example sentences, and flag (×)/(X)/(x) markers in red
function renderTip(str){
  let esc = escapeHtml(str);
  esc = esc.replace(/[A-Z][A-Za-z0-9,'\-\/ ]*[.!?]/g, m => '<b>' + m + '</b>');
  esc = esc.replace(/\(\s*[×xX]\s*\)/g, m => '<span class="bad-mark">' + m + '</span>');
  esc = esc.replace(/\{\{H:([^}]*)\}\}/g, (m, t) => '<span class="hl">' + t + '</span>');
  return esc;
}

// quiz prompts: underline common negative-qualifier phrases ("쓸 수 없는", "옳지 않은" ...)
// so students don't misread them as positive questions
const NEGATIVE_PHRASES = ['쓸 수 없는', '올 수 없는', '붙일 수 없는', '옳지 않은', '알맞지 않은', '적절하지 않은', '바르지 않은', '틀린 것', '아닌 것'];
function underlineNegatives(str){
  let esc = escapeHtml(str);
  NEGATIVE_PHRASES.forEach(p => { esc = esc.split(p).join('<u>' + p + '</u>'); });
  return esc;
}

function renderSegs(segs, prefix, s){
  const nextKey = blankKey(prefix);
  return segs.map(seg => {
    if (seg.t === 'text') return escapeHtml(seg.v);
    if (seg.t === 'verb') return '<span class="verb">' + escapeHtml(seg.v) + '</span>';
    if (seg.t === 'hl') return '<span class="hl">' + escapeHtml(seg.v) + '</span>';
    // blank
    const key = nextKey();
    if (seg.choices){
      const done = s.choiceDone.has(key);
      if (done){
        // once solved, collapse the choice buttons into plain confirmed text so the
        // wrong option doesn't linger in red and break the reading flow of the sentence
        return '<span class="blank revealed" data-key="' + key + '">' + escapeHtml(seg.v) + '</span>';
      }
      const wrongSet = s.choiceWrong[key] || new Set();
      const btns = seg.choices.map(choice => {
        let cls = 'cbtn';
        let dis = '';
        if (wrongSet.has(choice)){
          cls += ' wrong'; dis = 'disabled';
        }
        return '<button class="' + cls + '" ' + dis + ' data-blankkey="' + key + '" data-choice="' + escapeAttr(choice) + '" data-answer="' + escapeAttr(seg.v) + '">' + escapeHtml(choice) + '</button>';
      }).join('');
      return '<span class="cgroup">' + btns + '</span>';
    }
    const isRevealed = s.revealed.has(key);
    return '<span class="blank' + (isRevealed ? ' revealed' : '') + '" data-key="' + key + '" data-word="' + escapeAttr(seg.v) + '">' +
      (isRevealed ? escapeHtml(seg.v) : '?') + '</span>';
  }).join('');
}

function renderC3(c){
  if (!c.c3 || !c.c3.length) return '';
  return '<details class="more"><summary>더 알아두기</summary>' + c.c3.map(b =>
    '<div class="more-block"><div class="more-title">' + escapeHtml(b.t) + '</div>' +
    '<div class="more-body">' + escapeHtml(b.b) + '</div>' +
    b.ex.map(e => '<div class="more-ex"><div class="en">' + escapeHtml(e[0]) + '</div><div class="kr">' + escapeHtml(e[1]) + '</div></div>').join('') +
    (b.bad ? '<div class="more-ex"><div class="en">' + escapeHtml(b.bad) + ' <span class="bad-mark">(×)</span></div></div>' : '') +
    '</div>').join('') + '</details>';
}

function renderSummarySegs(segs){
  return segs.map(seg => {
    if (seg.t === 'text') return escapeHtml(seg.v);
    if (seg.t === 'verb') return '<span class="verb">' + escapeHtml(seg.v) + '</span>';
    if (seg.t === 'hl') return '<span class="hl">' + escapeHtml(seg.v) + '</span>';
    return '<span class="kw">' + escapeHtml(seg.v) + '</span>';
  }).join('');
}

function render(){
  renderNav();
  const c = DATA[current];
  const s = state[current];
  const host = document.getElementById('cardHost');
  const done = isConceptDone(current);

  const explainHtml = c.explain.map((segs, pi) => '<p>' + renderSegs(segs, 'p' + pi, s) + '</p>').join('');

  const examplesHtml = c.examples.map((ex, xi) => {
    const en = plainText(ex.en);
    const krParts = ex.krChunked.split('/').map(p => p.trim()).filter(Boolean);
    const krHtml = krParts.map(p => escapeHtml(p)).join('<span class="slash">/</span>');
    return '<div class="example">' +
      '<div class="enrow">' +
        (AUDIO_ENABLED ? '<button class="speak" data-speak="' + escapeAttr(en) + '" title="발음 듣기">' + SPEAK_ICON + '</button>' : '') +
        '<div class="en">' + renderSegs(ex.en, 'xa' + xi, s) + '</div>' +
      '</div>' +
      '<div class="kr">' + krHtml + '</div>' +
    '</div>';
  }).join('');

  const quizHtml = c.check.map((q, qi) => {
    const qDone = s.quizDone[qi];
    const wrongSet = s.quizWrong[qi] || new Set();
    const choicesHtml = q.choices.map(choice => {
      let cls = 'choice', dis = '';
      if (qDone){
        dis = 'disabled';
        if (choice === q.answer) cls += ' correct';
        else if (wrongSet.has(choice)) cls += ' wrong';
      } else if (wrongSet.has(choice)){
        cls += ' wrong'; dis = 'disabled';
      }
      return '<button class="' + cls + '" ' + dis + ' data-qi="' + qi + '" data-choice="' + escapeAttr(choice) + '">' + escapeHtml(choice) + '</button>';
    }).join('');

    let feedbackHtml;
    if (qDone){
      feedbackHtml = '<div class="feedback"><span class="answer-label">정답이다!</span> ' + escapeHtml(q.hint) + '</div>';
    } else if (wrongSet.size > 0){
      feedbackHtml = '<div class="feedback"><span class="retry-label">다시 골라보자.</span> ' + escapeHtml(q.hint) + '</div>' +
        (c.c1 ? '<div class="c1line"><b>핵심 한 줄</b> · ' + escapeHtml(c.c1) + '</div>' : '');
    } else {
      feedbackHtml = '<div class="feedback"><span class="hint-label">힌트</span> ' + escapeHtml(q.hint) + '</div>';
    }

    return '<div class="q">' +
      '<div class="prompt"><span class="tag">' + escapeHtml(q.type) + '</span>' + underlineNegatives(q.prompt) + '</div>' +
      '<div class="choices">' + choicesHtml + '</div>' +
      feedbackHtml +
    '</div>';
  }).join('');

  let summaryHtml;
  if (done){
    const sumExplain = c.explain.map(segs => '<p>' + renderSummarySegs(segs) + '</p>').join('');
    const sumExamples = c.examples.map(ex =>
      '<div class="example"><div class="en">' + renderSummarySegs(ex.en) + '</div><div class="kr">' + escapeHtml(ex.kr) + '</div></div>'
    ).join('');
    summaryHtml =
      '<div class="section summary">' +
        '<h2>개념 정리</h2>' +
        (c.c1 ? '<p class="c1sum">' + escapeHtml(c.c1) + '</p>' : '') +
        '<div class="explain">' + sumExplain + '</div>' +
        sumExamples +
        renderC3(c) +
        (AUDIO_ENABLED ?
          '<div class="cardfoot" style="margin-top:10px;">' +
            '<button class="reset" id="listenAllBtn">예문 전체 듣기</button>' +
          '</div>'
        : '') +
      '</div>';
  } else {
    summaryHtml = '<div class="section"><div class="locked">' + LOCK_ICON + '문제를 모두 맞히면 이 개념의 정리 노트가 열린다.</div></div>';
  }

  host.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Concept ' + c.num + ' · ' + c.chapter + '</div>' +
      '<div class="cname">' + escapeHtml(c.name) + '</div>' +
      '<h1>' + escapeHtml(c.question) + '</h1>' +
      '<div class="section explain"><h2>설명</h2>' + explainHtml + '</div>' +
      '<div class="section"><h2>예문</h2>' + examplesHtml + '</div>' +
      (c.tip ? '<div class="section"><div class="tip"><span class="tip-label">헷갈리기 쉬운 포인트</span>' + renderTip(c.tip) + '</div></div>' : '') +
      '<div class="section quiz"><h2>바로 확인</h2>' + quizHtml + '</div>' +
      summaryHtml +
      '<div class="cardfoot">' +
        '<button class="reset" id="resetBtn">이 개념 다시 풀기</button>' +
        '<div class="pager">' +
          '<button class="ghost" id="prevBtn"' + (current === 0 ? ' disabled' : '') + '>이전</button>' +
          '<button id="nextBtn"' + (current === DATA.length - 1 ? ' disabled' : '') + '>다음 개념</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  // reveal-blank clicks
  host.querySelectorAll('.blank').forEach(el => {
    el.addEventListener('click', (ev) => {
      if (el.classList.contains('revealed')) return;
      const key = el.dataset.key;
      s.revealed.add(key);
      el.textContent = el.dataset.word;
      el.classList.add('revealed');
      addScore(2, ev);
      maybeAutoSpeak(c, s, key);
      renderNav();
    });
  });

  // choice-blank clicks (inline, retry until correct)
  host.querySelectorAll('.cbtn').forEach(el => {
    el.addEventListener('click', (ev) => {
      const key = el.dataset.blankkey;
      if (s.choiceDone.has(key)) return;
      const choice = el.dataset.choice, answer = el.dataset.answer;
      if (choice === answer){
        s.choiceDone.add(key);
        addScore(10, ev);
        maybeAutoSpeak(c, s, key);
        render();
      } else {
        if (!s.choiceWrong[key]) s.choiceWrong[key] = new Set();
        s.choiceWrong[key].add(choice);
        addScore(-3, ev);
        render();
      }
    });
  });

  // quiz choice clicks (retry until correct)
  host.querySelectorAll('.choice').forEach(el => {
    el.addEventListener('click', (ev) => {
      const qi = el.dataset.qi;
      if (s.quizDone[qi]) return;
      const choice = el.dataset.choice;
      const q = c.check[qi];
      if (choice === q.answer){
        s.quizDone[qi] = true;
        addScore(10, ev);
      } else {
        if (!s.quizWrong[qi]) s.quizWrong[qi] = new Set();
        s.quizWrong[qi].add(choice);
        addScore(-3, ev);
      }
      render();
    });
  });

  if (AUDIO_ENABLED){
    host.querySelectorAll('[data-speak]').forEach(el => {
      el.addEventListener('click', () => speak(el.dataset.speak));
    });
  }

  const listenAllBtn = document.getElementById('listenAllBtn');
  if (listenAllBtn) listenAllBtn.onclick = () => speakQueue(c.examples.map(ex => plainText(ex.en)));

  document.getElementById('resetBtn').onclick = () => {
    s.revealed.clear(); s.choiceDone.clear(); s.choiceWrong = {};
    s.quizDone = {}; s.quizWrong = {}; s.exSpoken.clear();
    render();
  };
  document.getElementById('prevBtn').onclick = () => { if (current > 0){ current--; render(); } };
  document.getElementById('nextBtn').onclick = () => { if (current < DATA.length - 1){ current++; render(); } };
}

function maybeAutoSpeak(c, s, changedKey){
  if (!AUDIO_ENABLED) return;
  // if this blank belongs to an example and that example just became fully done, auto-speak it once
  const m = /^(xa(\d+))-/.exec(changedKey);
  if (!m) return;
  const xi = parseInt(m[2], 10);
  if (s.exSpoken.has(xi)) return;
  if (isExampleDone(c, s, xi)){
    s.exSpoken.add(xi);
    speak(plainText(c.examples[xi].en));
  }
}

setMascot('neutral');
render();
</script>

</body></html>
