<title>7과 문장 성분 연습</title>
<style>
:root{--bg:#f1efe9;--panel:#fff;--ink:#1f1d1a;--mute:#5d584f;--soft:#8a847a;--line:#e0dbd0;--accent:#2f4858;--bad:#c0392b;--good:#2e7d32;
--S:#ffc83d;--V:#ff8f87;--O:#a9e6a4;--C:#9fd3f2;--MA:#d5bbff;--MB:#ffdcae;--CJ:#dcdcdc;--font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
.shell{min-width:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:900;margin:0}h2{font-size:15px;font-weight:800;margin:6px 0 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--panel);border:0;border-radius:14px;padding:18px 14px;text-align:left;font-weight:800;font-size:17px;border-left:6px solid var(--c,#888)}
.big small{display:block;font-weight:500;font-size:12px;color:var(--soft);margin-top:2px}
.wide{grid-column:1/-1}
.card{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.no{font-size:12px;font-weight:800;color:var(--soft)}
.sent{font-size:19px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
#sent{background:#e6f1ff;border:2px solid #2b6cb0;border-radius:12px;padding:12px 12px 4px;color:#0f3459;font-size:20px}
#sent .t{background:#c9dffa}
.ch{display:inline-block;margin:0 3px 8px 0;text-align:center;vertical-align:top;max-width:100%}
.ch .t{display:inline-block;padding:2px 6px;border-radius:4px;background:#ecebe6}
.ch .l{display:block;margin-top:2px;line-height:1.25}
.ch .g{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.ch .r{display:block;font-size:11.5px;color:var(--mute)}
.ch .r small{font-size:10px;color:var(--soft);opacity:.8}
.k-S{background:var(--S)!important}.k-V{background:var(--V)!important}.k-O{background:var(--O)!important}.k-C{background:var(--C)!important}.k-MA{background:var(--MA)!important}.k-MB{background:var(--MB)!important}.k-CJ{background:var(--CJ)!important}
.ko{color:var(--mute);font-size:14px}
.wm{font-size:12.5px;color:var(--soft)}
.note,.postit{font-size:13px;background:#fff1a8;border-radius:3px;padding:9px 11px;box-shadow:1px 2px 4px rgba(0,0,0,.14);line-height:1.5;margin-top:8px}
.qr .g{flex-basis:100%;font-size:13.5px;font-weight:600;color:#333}
.sub{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
.anc{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.anc b{font-weight:800;color:var(--ink)}
.anc .x{padding:1px 6px;border-radius:4px;color:#2a2a2a}
.legend{display:flex;gap:6px;flex-wrap:wrap}.legend span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;color:#2a2a2a}
.nav,.btnrow{display:flex;gap:10px}
.pri{flex:1;border:0;border-radius:999px;padding:14px;font-weight:800;background:var(--accent);color:#fff;font-size:15px}
.pri.warn{background:#b3541e}
.back{border:0;background:var(--panel);border-radius:999px;padding:14px;font-weight:800;font-size:15px;width:100%}
.rows{display:flex;flex-direction:column}
.qr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.qr:first-child{border-top:0}
.qr .t{font-size:18px;font-weight:600;background:#ecebe6;border-radius:4px;padding:2px 8px}
.opt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opt button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.opt button.sel,.popt button.sel{background:#2f4858;border-color:#2f4858;color:#fff}
.popt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;width:100%}
.popt button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.pbox{width:100%}.pbox:empty{display:none}
.mk{display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;font-weight:900;color:#fff;font-size:14px;line-height:24px}
.mko{background:var(--good)}.mkx{background:var(--bad)}
.qr.wr{background:#fff1ef;border-radius:8px;padding-left:8px;padding-right:8px}
.mine{color:var(--bad);font-weight:700;font-size:14px;text-decoration:line-through}
.res{font-weight:800;font-size:15px;padding:4px 0}.resx{color:var(--bad)}.reso{color:var(--good)}
.cap{flex-basis:100%;font-size:11.5px;font-weight:800;color:#2f4858;margin-bottom:-4px}
.cap2{flex-basis:100%;font-size:11.5px;font-weight:700;color:#8a847a}
.pbox{margin-top:2px;padding-top:6px;border-top:1px dashed #d8d3c8}
.popt button{background:#f4f2ee;border:1.5px dashed #cfc9bc;color:#6f6a60;font-weight:600;font-size:13px;padding:5px 11px}
.popt button.sel{background:#9a948a;border:1.5px solid #9a948a;color:#fff}
.wrap{min-width:0;max-width:100%;background:#ffe3ea;border-radius:10px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.wh{font-weight:900;font-size:15px;color:#7a2a45}
.wl{display:flex;gap:8px;align-items:flex-start;min-width:0}.wc{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.wn{flex:0 0 58px;padding-top:5px;font-size:12px;font-weight:800;color:#7a2a45}
.wl .x{flex:0 1 auto;overflow-wrap:anywhere;min-width:0;padding:3px 8px;border-radius:5px;font-size:15px;font-weight:600}
.lk{border:0;background:none;color:#2b6cb0;font-weight:800;font-size:13px;margin-left:8px;text-decoration:underline;padding:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .card{max-width:520px;width:100%}
.cc{display:flex;flex-direction:column;gap:10px}.cch{font-weight:900;font-size:16px}
.ccl{font-size:15px}.ccx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:17px}
.ccx .x{padding:3px 8px;border-radius:5px;font-weight:600}
.why{flex-basis:100%;font-size:13px;color:#5d584f;font-weight:600;padding-left:32px}
.confl{margin-top:10px;font-size:14px;line-height:1.7}
.pri:disabled{opacity:.35}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opt button.sh{animation:sh .35s}
.opt button.bad{border-color:var(--bad);color:var(--bad)}
.ok{color:var(--good);font-weight:800;font-size:14px}
.prog{font-size:13px;font-weight:800;color:var(--soft)}
.sum{font-size:15px}
.inner{margin:12px 0 4px 2px;padding:10px 6px 10px 10px;border-left:6px solid var(--O);border-radius:0 10px 10px 0;background:#faf9f5}
.inner.m{border-left-color:var(--MA)}
.ftag{font-size:12px;font-weight:800;color:var(--soft)}
.inner .ftag{color:#5a5448}
.sm{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;margin:8px 8px 0 0}
.tg{font-size:12px;color:#7b4fc0;font-weight:700}

.wl{flex-wrap:wrap}.wl .x{flex:0 0 auto!important;max-width:100%;overflow-wrap:break-word!important}
.inner .card{padding:10px 8px}
@media(max-width:480px){
body{padding-left:10px;padding-right:10px}
.opt,.popt{gap:4px}
.opt button,.popt button{padding:5px 8px;font-size:13px;border-width:1.5px}
.popt button{font-size:12.5px;padding:4px 7px}
.card{padding:12px 12px}
.inner{padding:8px 4px 8px 6px;border-left-width:5px}
.qr{gap:6px;padding:8px 0}
}
#sent1,#sent2{background:#e6f1ff;border:2px solid #2b6cb0;border-radius:12px;padding:12px 12px 4px;color:#0f3459;font-size:20px}
#sent1 .t,#sent2 .t{background:#c9dffa}
.clos{background:#fff6c2;border:1px solid #ecd978;border-radius:6px 6px 16px 6px;box-shadow:2px 3px 0 rgba(0,0,0,.09);padding:14px 14px 14px;margin-top:14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.clos::after{content:"";position:absolute;right:0;bottom:0;width:24px;height:24px;background:linear-gradient(135deg,#fff6c2 50%,#ead66c 50%)}
.clos .wh{font-size:15px;color:#5b4a08}
.rw{position:relative;padding-top:0}.rw.has{padding-top:40px}.grp .n{font-size:11.5px;font-weight:800;color:#6b5a10;margin-bottom:2px}.grp.l2{margin-left:6px;padding-left:10px;border-left:4px solid #a9e6a4}.grp.l2.m{border-left-color:#d5bbff}.clos{padding-right:30px}
.rw svg.ar{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cl{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-end}
.cl .n{flex:0 0 100%;font-size:11.5px;font-weight:800;color:#6b5a10}
.cb{display:flex;flex-direction:column;gap:1px}
.cb i{font-style:normal;font-size:10.5px;font-weight:700;color:#7a6a20}
.cb .x{padding:3px 8px;border-radius:5px;font-size:15px;font-weight:600;overflow-wrap:break-word;max-width:100%}
.clz{font-size:13.5px;font-weight:700;color:#4d4210;line-height:1.55;border-top:1px dashed #d9c55a;padding-top:8px}
.tgb{font-size:13px}

.rw.has .cl{row-gap:30px}
.sec{font-size:13px;font-weight:800;color:var(--soft);margin-top:8px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blk{position:relative;background:var(--panel);border:0;border-left:5px solid var(--c,#888);border-radius:10px;padding:11px 4px 11px 8px;font-weight:800;font-size:13px;text-align:left;white-space:nowrap}
.blk.dn{background:#f6f4ee;color:#6d675c}
.blk i{font-style:normal;position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--good)}
</style>

function rel(c,it){

function head(c){
  let det=[c.kind,c.info].filter(Boolean).join(', ').split(/\s*,\s*/).filter(Boolean);
  const seen=[];det.forEach(d=>{const dd=d.replace(/\(.*\)/,'').trim();if(dd&&!seen.some(x=>x.indexOf(dd)>=0||dd.indexOf(x)>=0)){seen.push(d)}});
  det=seen;let h=c.who||'';
  det=det.filter(d=>d!==h);
  if(det.length&&h&&det[0].indexOf(h)===0){h=det.shift()}
  return esc(h)+det.map(d=>' · '+esc(d)).join('');
}

const BEV=['is','am','are','was','were','be','been','being'];
function mainV(c,it){
  const ch=it.chunks,k=ch.indexOf(c);let a=0,z=ch.length;
  for(let j=k-1;j>=0;j--)if(B(ch[j])==='CJ'){a=j+1;break}
  for(let j=k+1;j<ch.length;j++)if(B(ch[j])==='CJ'){z=j;break}
  const vs=ch.slice(a,z).filter(x=>x.role==='V');
  return vs.length?vs[vs.length-1]:(ch.filter(x=>x.role==='V')[0]||{t:'동사'});
}
function whyRole(c,it){

function startQ(r){round=r;cust=null;retried=false;conf={};if(seen())quiz(0,0,[]);else concept(()=>quiz(0,0,[]))}
/* ---------- copy view ---------- */
function label(c,it){
  const b=B(c);let sm='';
  if(c.who)sm=head(c);else if(b==='M'&&c.kind)sm=esc(c.kind);
  let tg='';
  if(b==='M'){if(c.to===-1)tg=' → 문장 전체 꾸밈';else if(c.to>=0)tg=' → '+en(cands(it)[c.to].t)+' 꾸밈'}
  return (c.k?'<span class="g">'+esc(c.k)+'</span>':'')+'<span class="r">'+(b==='CJ'?'접속사':NAME[c.role])+(sm?' <small>('+sm+')</small>':'')+tg+'</span>';
}
function chunkSpans(it){
  return it.chunks.map((c,i)=>sp(c,i)+'<span class="ch"><span class="t k-'+ck(c)+'">'+esc(c.t)+'</span><span class="l">'+label(c,it)+'</span></span>').join('');
}
function subHTML(chs){
  return chs.map(c=>{
    const b=B(c);let extra='';
    if(b==='M'&&c.to>=0&&chs[c.to])extra=' → '+en(chs[c.to].t)+' 꾸밈';
    return '<div class="sub"><b>'+(b==='CJ'?'접속사':NAME[c.role])+'</b> '+en(c.t)+(c.who?' <span class="wm">'+head(c)+'</span>':(c.kind?' <span class="wm">'+esc(c.kind)+'</span>':''))+extra+'</div>';
  }).join('');
}
function anchHTML(code){
  const a=ANCH[code];
  return '<div class="anc"><b>'+a[0]+'</b>'+a[2].map(e=>'<span class="x k-'+e[1]+'" lang="en" translate="no">'+esc(e[0])+'</span>').join('')+'<span>와 같은 구조</span></div>';
}
function copyView(wl,wrong){
  const its=items();
  let h='<h1>틀린 문장 색칠</h1><div class="legend"><span class="k-S">주어</span><span class="k-V">동사</span><span class="k-O">목적어</span><span class="k-C">보어</span><span class="k-MA">형용사 수식어</span><span class="k-MB">그 밖의 수식어</span></div>';
  wl.forEach(i=>{
    const it=its[i];
    const wm=it.words.filter(w=>w.pos!=='관사').map(w=>en(w.w)+' '+esc(w.mean)).join(' · ');
    const subs=it.chunks.filter(c=>c.sub).map(c=>subHTML(c.sub)).join('');
    h+='<div class="card"><div class="no">'+esc(it.no)+(it.pt?'':' · '+esc(it.pattern))+'</div><div class="sent" lang="en" translate="no">'+chunkSpans(it)+'</div>'+(it.pt?anchHTML(it.pt):'')+subs+'<div class="ko">'+esc(it.ko)+'</div><div class="wm">'+wm+'</div>'+(it.memo?'<div class="note"><b>'+esc(it.memo.basis)+'</b> '+esc(it.memo.text||'')+'</div>':'')+'</div>';
  });
  h+='<div class="btnrow"><button class="pri" id="go">다 칠했음</button></div><button class="back" id="lst">목록으로</button>';
  app.innerHTML=h;

  window.scrollTo(0,0);
}
function afterCopy(wl,wrong){
  if(!retried&&wl.length>=5){const its=items();cust=wl.map(i=>its[i]);retried=true;quiz(0,wrong,[])}else done(wrong)
}
function confHTML(){
  const a=Object.keys(conf).map(k=>[k,conf[k]]).sort((x,y)=>y[1]-x[1]).slice(0,3);
  if(!a.length)return '';
  return '<div class="confl"><b>많이 헷갈린 것</b>'+a.map(e=>'<div>'+esc(e[0])+' · '+e[1]+'번</div>').join('')+'</div>';
}
function done(wrong){
  cust=null;const its=items();recSet(round,wrong);
  app.innerHTML='<h1>'+its[0].no+' – '+its[its.length-1].no+' 완료</h1><div class="card sum">오답 '+wrong+'번'+confHTML()+'</div><button class="pri" id="bk">목록으로</button>';

/* ---------- one floor ---------- */
function mount(it,host,floor,cls,done,opt){
  opt=opt||{};
  host.innerHTML='<div class="card"><div class="ftag"></div><div class="sent" lang="en" translate="no" id="sent'+floor+'">'+it.chunks.map((c,k)=>sp(c,k)+'<span class="t" data-k="'+k+'">'+esc(c.t)+'</span>').join('')+'</div><div class="rows"></div></div><div class="btnrow"><button class="pri" disabled>제출</button></div>';
  host.className=cls;
  host.querySelector('.ftag').textContent=opt.tag||(floor+'층');
  const rows=host.querySelector('.rows'),sub=host.querySelector('.pri');
  const st=it.chunks.map(()=>({role:opt.fixedM?'M':null,who:null,to:undefined}));let pat=null;
  const cd=cands(it),noneOK=true,cjOK=cd.some(x=>x.role==='M'&&B(x)!=='CJ'&&x.to>=0&&B(cd[x.to])==='CJ');
  function complete(){
    for(let k=0;k<it.chunks.length;k++){const s=st[k];if(!s.role)return false;
      if((s.role==='S'||s.role==='O'||s.role==='C')&&!s.who)return false;
      if(s.role==='M'&&s.to===undefined)return false}
    if(it.pt&&!pat)return false;return true;
  }
  function refresh(){sub.disabled=!complete()}
  const rowEls=[];
  it.chunks.forEach((c,k)=>{
    const r=document.createElement('div');r.className='qr';
    r.innerHTML='<span class="t" lang="en" translate="no">'+esc(c.t)+'</span>'+(c.k?'<span class="g">'+esc(c.k)+'</span>':'')+(opt.fixedM?'':'<div class="cap">문장성분</div><span class="opt"></span>')+'<div class="pbox"></div>';
    const o=r.querySelector('.opt'),pb=r.querySelector('.pbox');
    function drawSub(){
      pb.innerHTML='';const s=st[k];
      if(s.role==='S'||s.role==='O'||s.role==='C'){
        const line=document.createElement('div');line.className='popt';
        line.innerHTML='<span class="cap2">누가 들어갔나?</span>';
        WHO.forEach((w,wi)=>{if(wi===3){const br=document.createElement('span');br.style.cssText='flex:0 0 100%;height:0';line.appendChild(br)}const b=document.createElement('button');b.textContent=w;if(s.who===w)b.className='sel';b.onclick=()=>{s.who=w;drawSub();refresh()};line.appendChild(b)});
        pb.appendChild(line);
      }else if(s.role==='M'){
        const line=document.createElement('div');line.className='popt';
        line.innerHTML='<span class="cap2">누구를 꾸미나?</span>';
        cd.forEach((x,j)=>{if(j===k||(B(x)==='CJ'&&!cjOK))return;const b=document.createElement('button');const same=cd.filter(y=>y.t===x.t&&!(B(y)==='CJ'&&!cjOK));const ord=same.length>1?' '+'①②③④⑤'[same.indexOf(x)]:'';b.textContent=x.t+ord;b.dataset.j=j;b.setAttribute('lang','en');if(s.to===j)b.className='sel';b.onclick=()=>{s.to=j;drawSub();refresh()};line.appendChild(b)});
        const b=document.createElement('button');b.textContent='문장 전체';if(s.to===-1)b.className='sel';b.onclick=()=>{s.to=-1;drawSub();refresh()};line.appendChild(b);
        if(noneOK){const b2=document.createElement('button');b2.textContent='꾸밈 없음';if(s.to===-2)b2.className='sel';b2.onclick=()=>{s.to=-2;drawSub();refresh()};line.appendChild(b2)}
        pb.appendChild(line);
      }
    }
    if(o)ROLEOPT.forEach(([key,nm])=>{
      const b=document.createElement('button');b.textContent=nm;
      b.onclick=()=>{st[k].role=key;st[k].who=null;st[k].to=undefined;o.querySelectorAll('button').forEach(x=>x.className=x===b?'sel':'');drawSub();refresh()};
      o.appendChild(b)});
    if(opt.fixedM)drawSub();
    rows.appendChild(r);rowEls.push(r);
  });
  let pr=null;
  if(it.pt){
    pr=document.createElement('div');pr.className='qr';
    pr.innerHTML='<span class="t" style="background:transparent;padding-left:0">문형</span><span class="opt"></span>';
    const o=pr.querySelector('.opt');
    Object.keys(ANCH).forEach(code=>{
      const b=document.createElement('button');b.textContent=code;
      b.onclick=()=>{pat=code;o.querySelectorAll('button').forEach(x=>x.className=x===b?'sel':'');refresh()};
      o.appendChild(b)});
    rows.appendChild(pr);
  }
  sub.onclick=()=>{
    if(!complete())return;
    sub.style.display='none';let bad=0;
    it.chunks.forEach((c,k)=>{
      const s=st[k],r=rowEls[k],b=B(c);
      let ok=s.role===b,kind='role';
      if(ok&&(b==='S'||b==='O'||b==='C')){ok=s.who===c.who;kind='who'}
      if(ok&&b==='M'){ok=s.to===c.to;kind='to'}
      const cls2='k-'+ck(c);r.querySelector('.t').classList.add(cls2);host.querySelector('.sent .t[data-k="'+k+'"]').classList.add(cls2);
      const oo=r.querySelector('.opt');if(oo)oo.remove();r.querySelector('.pbox').remove();
      const cp=r.querySelector('.cap');if(cp)cp.remove();
      if(ok){r.insertAdjacentHTML('beforeend','<span class="mk mko">O</span><span class="ok">'+ansText(c,it)+'</span>')}
      else{bad++;r.classList.add('wr');
        let why;
        if(kind==='role'){why=whyRole(c,it);bump((BN[s.role]||'')+' → '+BN[b])}
        else if(kind==='to'){why=c.to===-2?c.t+' = 문장을 여는 말, 꾸미는 대상이 없음':c.t+' 는 '+toName(c,it)+' 를 꾸미는 말';bump('꾸미는 대상')}
        else{why=c.t+' = '+WHYWHO[c.who];bump(s.who+' → '+c.who)}
        const mine=(BN[s.role]||'')+(s.who?' ('+s.who+')':'')+(s.role==='M'&&s.to!==undefined?' → '+(s.to===-1?'문장 전체':s.to===-2?'꾸밈 없음':cd[s.to].t):'');
        r.insertAdjacentHTML('beforeend','<span class="mk mkx">X</span><span class="mine">내 답: '+esc(mine)+'</span><span class="ok">정답: '+ansText(c,it)+'</span><div class="why" lang="ko">'+esc(why)+'</div>')}
    });
    if(it.pt){
      const ok=pat===it.pt;pr.querySelector('.opt').remove();
      if(ok)pr.insertAdjacentHTML('beforeend','<span class="mk mko">O</span><span class="ok">'+it.pt+' · '+ANCH[it.pt][1]+'</span>');
      else{bad++;bump('문형');pr.classList.add('wr');pr.insertAdjacentHTML('beforeend','<span class="mk mkx">X</span><span class="mine">내 답: '+pat+'</span><span class="ok">정답: '+it.pt+' · '+ANCH[it.pt][1]+'</span>')}
      const sk=it.chunks.filter(c=>B(c)!=='M'&&B(c)!=='CJ').map(c=>'<span class="x k-'+ck(c)+'" lang="en" translate="no">'+esc(c.t)+'</span>').join('');
      const an=ANCH[it.pt][2].map(e=>'<span class="x k-'+e[1]+'" lang="en" translate="no">'+esc(e[0])+'</span>').join('');
      rows.insertAdjacentHTML('afterend','<div class="wrap"><div class="wh">'+it.pt+' · '+ANCH[it.pt][1]+'</div><div class="wl"><span class="wn">이 문장</span>'+sk+'</div><div class="wl"><span class="wn">기본 예문</span>'+an+'</div></div>');
    }
    rows.insertAdjacentHTML('beforebegin','<div class="res '+(bad?'resx':'reso')+'">'+(bad?'틀린 곳 '+bad+'개':'모두 맞음')+'</div>');
    if(floor===1)window.scrollTo(0,0);else host.scrollIntoView({block:'start'});
    done(bad);
  };
}
/* ---------- closing card with arrows ---------- */
function ilab(x){
  const d=(x.kind||'')+(x.info||'');
  if(B(x)==='S'&&/가주어/.test(d))return '가주어';
  if(B(x)==='S'&&/진주어/.test(d))return '진주어';
  if(B(x)==='CJ')return '접속사';
  return NAME[x.role]||'';
}
function rowHTML(chunks,extra,label,cls,bar){
  const all=chunks.concat(extra||[]);
  const pairs=[];
  all.forEach((c,i)=>{if(c.role==='M'&&B(c)!=='CJ'&&c.to!==undefined&&c.to>-2)pairs.push([i,c.to,isAdj(c)?'#6f3fc2':'#c9680f'])});
  const gi=chunks.findIndex(x=>B(x)==='S'&&/가주어/.test((x.kind||'')+(x.info||'')));
  const ji=chunks.findIndex(x=>B(x)==='S'&&/진주어/.test((x.kind||'')+(x.info||'')));
  if(gi>=0&&ji>=0)pairs.push([gi,ji,'#8a7a2a','d']);
  return '<div class="grp'+(cls||'')+'"'+(bar?' style="border-left-color:'+bar+'"':'')+'><div class="n">'+label+'</div><div class="rw" data-pairs=\''+JSON.stringify(pairs)+'\'><svg class="ar"></svg><div class="cl">'+all.map(x=>'<span class="cb"><i>'+ilab(x)+'</i><span class="x k-'+ck(x)+'" lang="en" translate="no">'+esc(x.t)+'</span></span>').join('')+'</div></div></div>';
}
function draw(){
  document.querySelectorAll('.rw').forEach(rw=>{
    const pairs=JSON.parse(rw.getAttribute('data-pairs')||'[]');
    rw.classList.toggle('has',pairs.length>0);
    const svg=rw.querySelector('svg'),R=rw.getBoundingClientRect(),cbs=[].slice.call(rw.querySelectorAll('.cb'));let out='';
    function box(i){const b=cbs[i].getBoundingClientRect();return {x:b.left-R.left+b.width/2,top:b.top-R.top,bot:b.bottom-R.top,l:b.left-R.left,r:b.right-R.left}}
    pairs.forEach(p=>{
      const a=box(p[0]),col=p[2];
      if(p[1]===-1){
        const first=box(0),last=box(cbs.length-1),y=10;
        out+='<path d="M'+a.x+' '+(a.top-2)+' V'+y+' M'+first.l+' '+(y+7)+' V'+y+' H'+last.r+' V'+(y+7)+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/><text x="'+((first.l+last.r)/2)+'" y="'+(y-3)+'" font-size="11" font-weight="700" fill="'+col+'" text-anchor="middle">문장 전체</text>';
        return;
      }
      const b=box(p[1]);
      if(p[3]==='d'){
        const d=Math.abs(a.x-b.x),h=Math.min(22,10+d/12),y0=a.top-2;
        out+='<path d="M'+a.x+' '+y0+' C'+a.x+' '+(y0-h*1.3)+' '+b.x+' '+(y0-h*1.3)+' '+b.x+' '+y0+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>';
        return;
      }
      if(Math.abs(a.top-b.top)>10){const dn=a.top>b.top,x1=a.x,y1=dn?a.top-1:a.bot+1,x2=b.x,y2=dn?b.bot+2:b.top-2,sg=dn?1:-1;out+='<path d="M'+x1+' '+y1+' C'+x1+' '+(y1-sg*8)+' '+x2+' '+(y2+sg*8)+' '+x2+' '+y2+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/><path d="M'+(x2-5)+' '+(y2+sg*6)+' L'+x2+' '+y2+' L'+(x2+5)+' '+(y2+sg*6)+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';return}
      const d=Math.abs(a.x-b.x),h=Math.min(24,12+d/12),y0=a.top-2,y1=a.top-3;
      out+='<path d="M'+a.x+' '+y0+' C'+a.x+' '+(y0-h*1.3)+' '+b.x+' '+(y0-h*1.3)+' '+b.x+' '+(y1-1)+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/><path d="M'+(b.x-5)+' '+(y1-7)+' L'+b.x+' '+y1+' L'+(b.x+5)+' '+(y1-7)+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    svg.innerHTML=out;
  });
}
window.addEventListener('resize',draw);
function plab(it){return it.pt?it.pt+' ('+ANCH[it.pt][1]+')':esc(it.pattern)}
function closing(it,floors){
  let h='<div class="clos"><div class="wh">구조 정리</div>'+rowHTML(it.chunks,null,'1층 · '+plab(it),'',null);
  const zs=[];
  floors.forEach(f=>{
    const c=f.c,sit=f.sit;
    if(c.sub){
      h+=rowHTML(c.sub,null,'2층 · '+(c.subpt?c.subpt+' ('+ANCH[c.subpt][1]+')':''),' l2',barCol(c));
      let z=B(c)==='M'?(en(toName(c,it))+' 를 꾸미는 덩어리 = '+c.subpt+' 구조'):(NAME[c.role]+' 자리에 '+c.subpt+' 구조가 통째로 들어간 모양');
      const tg=c.sub.filter(x=>x.role==='M'&&x.to>=0&&B(x)!=='CJ');
      if(tg.length)z+='<br>2층 '+en(tg[0].t)+' → '+en(c.sub[tg[0].to].t)+' 꾸밈';
      zs.push(z);
    }else if(c.chain){
      h+=rowHTML(c.chain.chunks,c.chain.extra,'꾸밈 사슬',' l2',barCol(c));
      zs.push(en(c.chain.chunks.map(x=>x.t).concat(c.chain.extra.map(x=>x.t)).join(' → '))+' 순서로 꾸밈이 이어지는 구조');
    }
  });
  it.chunks.forEach(c=>{
    if(c.role==='M'&&c.to===-1)zs.push(en(c.t)+' = 문장 전체를 꾸미는 말 (뺄 수 있음)');
    if(c.role==='M'&&c.to===-2){const s=it.chunks.filter(x=>B(x)==='S')[0];zs.push(en(c.t)+' = 문장을 여는 유도부사'+(s?' · 뒤의 '+en(s.t)+' 가 진짜 주어 (도치)':''))}
  });
  const g=it.chunks.filter(x=>ilab(x)==='가주어')[0],j=it.chunks.filter(x=>ilab(x)==='진주어')[0];
  if(g&&j)zs.push(en(g.t)+' = 가주어 · '+en(j.t)+' = 진주어 (점선으로 연결)');
  if(zs.length)h+='<div class="clz">'+zs.join('<br>')+'</div>';
  return h+'</div>';
}
function floorsOf(it){return it.chunks.filter(c=>c.sub||c.chain)}
/* ---------- quiz ---------- */
function quiz(i,wrong,wl){
  const its=items();
  if(i>=its.length){if(wl.length)copyView(wl,wrong);else done(wrong);return}
  const it=its[i],lv=LEVEL[cur.id];
  app.innerHTML='<div class="prog">'+(retried?'다시 · ':'')+(i+1)+' / '+its.length+' <button class="lk" id="cc">개념</button></div><div id="f1"></div><div id="f2"></div><div id="nxt"></div><button class="back" id="lst">목록으로</button>';
  document.getElementById('cc').onclick=showConcept;document.getElementById('lst').onclick=()=>rounds(cur.id);
  const f2=document.getElementById('f2'),nxt=document.getElementById('nxt');
  let bad=0;
  function finish(opened){
    nxt.innerHTML=closing(it,opened)+(it.memo?'<div class="postit"><b>'+esc(it.memo.basis)+'</b>'+(it.memo.text?'<br>'+esc(it.memo.text):'')+'</div>':'')+'<button class="pri" style="width:100%;margin-top:12px">'+(i+1<its.length?'다음 문장':'끝')+'</button>';
    nxt.lastChild.onclick=()=>{if(bad){wrong+=bad;if(wl.indexOf(i)<0)wl.push(i)}quiz(i+1,wrong,wl)};
    draw();setTimeout(draw,250);setTimeout(draw,800);
  }
  function run(list,n,opened){
    if(n>=list.length){finish(opened);return}
    const c=list[n],sit=c.sub?{chunks:c.sub,pt:c.subpt}:{chunks:c.chain.chunks,extra:c.chain.extra};
    const host=document.createElement('div');f2.appendChild(host);
    mount(sit,host,2,'inner',b=>{bad+=b;opened.push({c:c,sit:sit});run(list,n+1,opened)},c.chain?{fixedM:true,tag:'꾸밈 사슬'}:{});
    host.style.borderLeftColor=barCol(c);
  }
  mount(it,document.getElementById('f1'),1,'',b1=>{
    bad+=b1;
    const fl=lv===0?[]:floorsOf(it);
    if(!fl.length){finish([]);return}
    if(lv===2){run(fl,0,[]);return}
    f2.innerHTML='<button class="sm" id="op">속 문장 열기</button><button class="sm" id="sk">건너뛰기</button>';
    document.getElementById('op').onclick=()=>{f2.innerHTML='';run(fl,0,[])};
    document.getElementById('sk').onclick=()=>{f2.innerHTML='';finish([])};
  });
  window.scrollTo(0,0);
}
home();
</script>
</body>
